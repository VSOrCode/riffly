<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Order confirmed — Riffly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23bd4b22'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='white' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="/index.html">Riffly<span class="brand__dot">.</span></a>
      <nav class="site-nav" aria-label="Primary">
        <a href="/index.html">Shop</a>
        <a href="/index.html#how">How it works</a>
        <a href="/about.html">About</a>
      </nav>
      <div class="site-header__actions">
        <a class="acct-link" href="/account.html" data-acct-label>Log in</a>
        <button class="cart-btn" data-cart-open aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 7h13l-1.4 9.5a2 2 0 0 1-2 1.7H9.4a2 2 0 0 1-2-1.7L6 7z"/><path d="M6 7 5 3H2"/><circle cx="9.5" cy="21" r="1"/><circle cx="17" cy="21" r="1"/></svg>
          <span>Cart</span>
          <span class="cart-btn__count" data-count="0">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="notice-page">
      <div class="notice-page__inner">
        <div class="notice-page__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <h1>Order confirmed</h1>
        <p id="success-msg">Thanks for shopping Riffly. A receipt is on its way to your email, and we&rsquo;ll have your order packed within two business days. One-of-a-kind means you got the only one.</p>
        <a class="btn btn--primary" href="/index.html">Keep browsing</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="site-footer__bar" style="border:0">
        <span>&copy; <span id="year">2026</span> Riffly &middot; riffly.com</span>
        <span>Secure checkout by Stripe</span>
      </div>
    </div>
  </footer>

  <script src="/assets/js/store.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var sid = new URLSearchParams(location.search).get("session_id");
      if (sid) {
        try { Riffly.clearCart(); } catch (e) {}
      } else {
        var m = document.getElementById("success-msg");
        if (m) m.textContent = "Thanks for shopping Riffly. If you just completed a purchase, your receipt is on its way by email.";
      }
    });
  </script>
</body>
</html>
